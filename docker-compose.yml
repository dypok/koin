services:
  koin-api:
    build:
      context: ./apps/server
      dockerfile: Dockerfile
    container_name: koin-api
    restart: unless-stopped
    environment:
      PORT: 3000
      DATABASE_URL: ${DATABASE_URL}
      JWT_SECRET: ${JWT_SECRET:-super_secret_jwt_key_koin_change_in_production_min32}
      CORS_ALLOWED_ORIGINS: "http://localhost:5173,http://localhost:8080,http://localhost:3000,http://koin-web,http://localhost"
      NODE_ENV: ${NODE_ENV:-development}
    ports:
      - "${API_PORT:-3000}:3000"
    networks:
      - koin-network

  koin-web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: koin-web
    restart: unless-stopped
    depends_on:
      - koin-api
    ports:
      - "${WEB_PORT:-5173}:80"
    networks:
      - koin-network

networks:
  koin-network:
    name: koin-network
    driver: bridge
